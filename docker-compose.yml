services:
  postgres:
    image: postgres:16-alpine
    container_name: peluquita-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: peluquita
      POSTGRES_PASSWORD: peluquita
      POSTGRES_DB: peluquita
    # Host 5433: en máquinas con un PostgreSQL nativo en 5432 (común en
    # Windows) se evita la colisión. El contenedor sigue en 5432 interno.
    ports:
      - "5433:5432"
    volumes:
      - peluquita-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peluquita -d peluquita"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: peluquita-api
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: peluquita-web
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  peluquita-pgdata:
