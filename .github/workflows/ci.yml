name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: peluquita
          POSTGRES_PASSWORD: peluquita
          POSTGRES_DB: peluquita
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://peluquita:peluquita@localhost:5432/peluquita?schema=public
      ADMIN_EMAIL: admin@peluquita.local
      ADMIN_PASSWORD: peluquita123
      SESSION_SECRET: ci-secret-solo-para-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Secrets scan
        run: pnpm secrets:scan

      - name: DB migrate + seed
        run: pnpm db:deploy && pnpm db:seed

      - name: Lint, typecheck, test, build
        run: pnpm turbo run lint typecheck test build

  # Sin job de preview: con Root Directory = apps/web, la integración GitHub
  # de Vercel ya crea previews automáticos en cada PR (un job propio acá
  # duplicaría deploys y correría `vercel build` desde la raíz, donde no
  # hay dependencia de Next.js).
